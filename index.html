y-p.h;p.vy=0;p.ground=true}}if(p.y>590){hit();return}if(p.x>1230)checkpoint=1250;if(p.x>1850)checkpoint=1850;if(p.x>2410)checkpoint=2420;for(let c of coins){if(!c.taken&&Math.abs(p.x+18-c.x)<32&&Math.abs(p.y+22-c.y)<40){c.taken=true;c.node.style.display='none';score+=5;bank+=5;effect('coin');persist();hud()}}if(!hasKey&&Math.abs(p.x+18-keyObj.x)<40&&Math.abs(p.y+22-keyObj.y)<50){hasKey=true;keyObj.node.style.display='none';hud()}for(let e of enemies){if(!e.alive)continue;e.x+=e.v*dt;if(e.x<e.a||e.x>e.b)e.v=-e.v;pos(e.node,e.x,435);let b={x:e.x-18,y:412,w:36,h:42};if(intersects(p,b)){if(p.vy>1&&prevBottom<=b.y+19){e.alive=false;e.node.style.display='none';p.vy=-10;score+=10;bank+=10;persist();hud()}else hit()}}if(p.x>2850&&!passed){p.x=2848;if(hasKey)quiz()}if(p.x>3005&&passed)win();cam=Math.max(0,Math.min(2240,p.x-280));layout();pos(hero,p.x+18,p.y+24);hero.style.transform='translate(-50%,-50%) scaleX('+p.face+')';hero.classList.toggle('idle',Math.abs(p.vx)<.1&&p.ground);hero.classList.toggle('jumping',!p.ground);hero.style.opacity=inv>0&&Math.floor(inv/6)%2?'.4':'1'}function tick(now){let dt=Math.min(2.2,(now-last)/16.67||1);last=now;try{update(dt)}catch(e){console.error(e);playing=false;modal('<h1>⚠️ Lỗi trò chơi</h1><p>'+String(e.message||e)+'</p><button class="btn" id="back">Quay lại</button>');document.getElementById('back').onclick=home}requestAnimationFrame(tick)}for(let k of ['left','right','jump']){let b=document.getElementById(k);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keyState[k]=true;b.classList.add('active')});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{keyState[k]=false;b.classList.remove('active')})}document.addEventListener('keydown',e=>{let k={'ArrowLeft':'left','KeyA':'left','ArrowRight':'right','KeyD':'right','ArrowUp':'jump','Space':'jump','KeyW':'jump'}[e.code];if(k){e.preventDefault();keyState[k]=true}});document.addEventListener('keyup',e=>{let k={
