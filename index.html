<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Nhi & Mon Adventure</title><style>
:root{font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#44315c}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(#7bd6ff 0%,#d4f7ff 42%,#92e681 43%,#43ba76);overflow-x:hidden}button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}.app{max-width:720px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 15px env(safe-area-inset-bottom)}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0}.chip{background:#fff9e9;border:3px solid #e6b65c;border-radius:22px;padding:8px 12px;font-weight:900;box-shadow:0 4px #bb8e4c}.title{text-align:center;color:#fff;text-shadow:0 4px #7446a0,2px 2px #7446a0,-2px -2px #7446a0;font-weight:1000;font-size:clamp(32px,8vw,53px);line-height:1.07;margin:18px 0 8px}.subtitle{text-align:center;color:#315c53;font-weight:800}.panel{background:#fffdf5;border:4px solid #d7a6ff;border-radius:30px;box-shadow:0 9px 0 #8b60bd,0 13px 22px #305f5540;padding:18px;margin:22px 0}.big{font-size:82px;text-align:center;line-height:1.3}.btn{display:block;width:100%;border-radius:20px;padding:15px;margin:12px 0;font-size:20px;font-weight:900;color:white;background:linear-gradient(#ffc746,#f38c21);box-shadow:0 6px #b96d16;text-shadow:0 2px #a45e15}.btn:active{transform:translateY(4px);box-shadow:0 2px #b96d16}.green{background:linear-gradient(#76df6b,#28ac62);box-shadow:0 6px #1b814c}.purple{background:linear-gradient(#b898fa,#8258d6);box-shadow:0 6px #5d3c9b}.small{font-size:15px;padding:11px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:3px solid #8ec1f5;border-radius:22px;background:#fff;padding:12px 4px;min-height:100px;box-shadow:0 5px #6195c9;font-weight:900;font-size:20px;color:#3c4c70}.choice .emoji{font-size:43px;display:block}.choice.correct{background:#c6ffc9;border-color:#2fbd61}.choice.wrong{background:#ffe0e0;border-color:#e96c78}.choice:disabled{opacity:.78}.path{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:20px}.level{background:#fff8e9;border:4px solid #ffcd69;border-radius:25px;min-height:134px;padding:10px;box-shadow:0 7px #cf9a4d;color:#5e436b}.level.lock{filter:grayscale(1);opacity:.7}.level .ico{font-size:45px}.level strong{display:block}.level span{font-size:13px}.level .stars{color:#eea300}.progress{height:17px;background:#ddd8ed;border-radius:30px;overflow:hidden;margin:14px 0}.progress div{height:100%;background:linear-gradient(90deg,#6bdd73,#ffd53f);transition:width .2s}.notice{text-align:center;font-size:19px;font-weight:900;min-height:28px;color:#8b49b6}.foot{text-align:center;font-size:12px;color:#28574a;padding:20px}.hidden{display:none}.row{display:flex;align-items:center;gap:9px;justify-content:space-between}.pill{background:#f2e5ff;border-radius:20px;padding:9px;font-weight:800}.spark{animation:bob 1.7s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-8px)}}@media(min-width:650px){.choices{grid-template-columns:repeat(2,1fr)}.app{padding-left:28px;padding-right:28px}}
</style></head><body><main class="app"><div class="top"><button class="chip" id="home" aria-label="Trang chủ">🏠</button><div class="chip" id="playerChip">👧 Nhi</div><div class="chip" id="coins">🪙 0</div></div><div id="screen"></div><div class="foot">🌟 Học vui mỗi ngày • Không cần tài khoản</div></main><script>
const stages=[{name:'Khu rừng động vật',icon:'🐱',words:[['Cat','🐱'],['Dog','🐶'],['Bird','🐦'],['Fish','🐟'],['Rabbit','🐰'],['Lion','🦁']]},{name:'Vườn trái cây',icon:'🍎',words:[['Apple','🍎'],['Banana','🍌'],['Orange','🍊'],['Grape','🍇'],['Mango','🥭'],['Strawberry','🍓']]},{name:'Vương quốc màu sắc',icon:'🌈',words:[['Red','🔴'],['Blue','🔵'],['Yellow','🟡'],['Green','🟢'],['Purple','🟣'],['Orange','🟠']]},{name:'Ngôi nhà bí mật',icon:'🏠',words:[['House','🏠'],['Bed','🛏️'],['Chair','🪑'],['Book','📚'],['Door','🚪'],['Clock','🕒']]},{name:'Lâu đài kho báu',icon:'🏰',words:[['Star','⭐'],['Moon','🌙'],['Sun','☀️'],['Tree','🌳'],['Flower','🌻'],['Car','🚗']]}];
let save;try{save=JSON.parse(localStorage.getItem('nhi_mon_adventure_v1'))||{}}catch(e){save={}};let profile='Nhi',stage=0,q=0,correct=0,wrong=0,questions=[],locked=false;const el=document.getElementById('screen');const get=()=>save[profile]||(save[profile]={coins:0,unlocked:1,stars:{}});function persist(){try{localStorage.setItem('nhi_mon_adventure_v1',JSON.stringify(save))}catch(e){}updateTop()}function updateTop(){document.getElementById('playerChip').textContent=(profile==='Nhi'?'👧 ':'👶 ')+profile;document.getElementById('coins').textContent='🪙 '+get().coins}function speak(t){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let a=new SpeechSynthesisUtterance(t);a.lang='en-US';a.rate=.76;a.pitch=1.07;speechSynthesis.speak(a)}catch(e){}}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function home(){updateTop();el.innerHTML=`<h1 class="title">🌟 Nhi & Mon<br>Adventure 🌈</h1><p class="subtitle">Phiêu lưu tiếng Anh • Vượt màn nhận quà</p><div class="panel"><div class="big spark">🦄 🏰 🎁</div><p class="subtitle">Chọn người chơi</p><button class="btn purple" onclick="choose('Nhi')">👧 Nhi • Thử thách 4 đáp án</button><button class="btn green" onclick="choose('Mon')">👶 Mon • 2 hình dễ thương</button><p class="subtitle">⭐ Thu thập sao • 🪙 Nhận xu • 🎁 Mở rương</p></div>`}function choose(p){profile=p;map()}function map(){updateTop();let d=get();el.innerHTML=`<h1 class="title">🗺️ Bản đồ phiêu lưu</h1><p class="subtitle">${profile} đã mở ${d.unlocked}/5 màn</p><div class="path">${stages.map((s,i)=>`<button class="level ${i>=d.unlocked?'lock':''}" ${i>=d.unlocked?'disabled':''} onclick="start(${i})"><div class="ico">${i>=d.unlocked?'🔒':s.icon}</div><strong>Màn ${i+1}</strong><span>${s.name}</span><div class="stars">${'⭐'.repeat(d.stars[i]||0)}${'☆'.repeat(3-(d.stars[i]||0))}</div></button>`).join('')}</div><button class="btn purple small" onclick="home()">Đổi người chơi</button>`}function start(i){stage=i;q=0;correct=0;wrong=0;locked=false;let words=stages[i].words;questions=shuffle(words).slice(0,5);renderQ()}function renderQ(){locked=false;let item=questions[q],opts=shuffle([item,...shuffle(stages[stage].words.filter(w=>w[0]!==item[0])).slice(0,profile==='Mon'?1:3)]);el.innerHTML=`<h1 class="title" style="font-size:31px">${stages[stage].icon} Màn ${stage+1}</h1><div class="panel"><div class="row"><span class="pill">Câu ${q+1}/5</span><span class="pill">⭐ ${correct}/5</span></div><div class="progress"><div style="width:${q*20}%"></div></div><p class="subtitle">${profile==='Mon'?'Nghe và chọn hình đúng':'Nhìn hình và chọn từ tiếng Anh'}</p><div class="big">${profile==='Mon'?'🔊':item[1]}</div><button class="btn purple small" onclick="speak(questions[q][0])">🔊 Nghe tiếng Anh</button><div class="choices">${opts.map(o=>`<button class="choice" data-answer="${o[0]}" onclick="answer(this)">${profile==='Mon'?`<span class="emoji">${o[1]}</span>`:''}${profile==='Nhi'?o[0]:''}</button>`).join('')}</div><p class="notice" id="notice"></p></div>`;if(profile==='Mon')setTimeout(()=>{if(!locked)speak(item[0])},350)}function answer(btn){if(locked)return;let expected=questions[q][0],ok=btn.dataset.answer===expected;if(!ok){wrong++;btn.classList.add('wrong');document.getElementById('notice').textContent='💪 Thử lại nhé!';speak(expected);setTimeout(()=>btn.classList.remove('wrong'),550);return}locked=true;correct++;get().coins+=10;persist();btn.classList.add('correct');document.getElementById('notice').textContent='🎉 Giỏi quá! +10 xu';speak(expected);document.querySelectorAll('.choice').forEach(b=>b.disabled=true);setTimeout(()=>{q++;if(q===5)finish();else renderQ()},1100)}function finish(){let d=get(),stars=wrong===0?3:wrong<=2?2:1;d.stars[stage]=Math.max(d.stars[stage]||0,stars);d.unlocked=Math.max(d.unlocked,Math.min(5,stage+2));d.coins+=20;persist();el.innerHTML=`<h1 class="title">🎊 Qua màn rồi!</h1><div class="panel"><div class="big spark">🎁 🏆 🎁</div><h2 style="text-align:center">${stages[stage].name}</h2><div class="big" style="font-size:55px">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p class="subtitle">Đúng 5/5 từ • Thưởng thêm 20 xu!</p><p class="subtitle">🪙 Tổng xu: ${d.coins}</p><button class="btn green" onclick="${stage<4?`start(${stage+1})`:'map()'}">${stage<4?'▶️ Màn tiếp theo':'🏰 Hoàn thành hành trình'}</button><button class="btn purple" onclick="map()">🗺️ Về bản đồ</button></div>`}document.getElementById('home').onclick=home;home();
</script></body></html>
