*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#101d3b;color:white;touch-action:none}#game{position:absolute;inset:0;width:100%;height:100%;display:block}#hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;gap:5px;pointer-events:none}#hud span{background:#17274dba;border:2px solid #ffffff66;border-radius:18px;padding:5px 10px;font-size:clamp(12px,2.8vw,17px);font-weight:800;text-shadow:0 1px 2px #333}#hud button{pointer-events:auto}button{font-family:inherit;font-weight:900;cursor:pointer;border:0;touch-action:none}#controls{position:absolute;bottom:max(13px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}#controls .cluster{display:flex;gap:12px} .control{pointer-events:auto;width:clamp(62px,14vw,86px);height:clamp(62px,14vw,86px);border-radius:25px;background:#ffffffb9;border:3px solid white;color:#263c7d;font-size:32px;box-shadow:0 5px 0 #62749a80;user-select:none}.control:active,.control.pressed{background:#ffe076;transform:translateY(3px)}#jump{background:#ffcf60;color:#874000}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#101b42bb;padding:15px;overflow:auto}#overlay.hidden{display:none}.panel{width:min(510px,96vw);max-height:95vh;overflow:auto;background:linear-gradient(#fffef0,#fff1bf);color:#263b69;border:5px solid #fff;border-radius:26px;box-shadow:0 12px 0 #182c63,0 22px 55px #0007;text-align:center;padding:clamp(14px,3vw,24px)}.panel h1{font-size:clamp(25px,5vw,36px);line-height:1.15;margin:4px 0 10px;color:#e27a19;text-shadow:1px 2px #fff}.panel h2{font-size:clamp(21px,4vw,29px);margin:8px 0}.panel p{margin:9px 0;font-size:clamp(14px,2.7vw,17px)}.btn{background:linear-gradient(#5bdb75,#20a65c);border:3px solid white;color:white;border-radius:18px;padding:12px 18px;font-size:clamp(16px,3.4vw,20px);box-shadow:0 5px 0 #167c47;margin:6px}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #167c47}.btn.blue{background:linear-gradient(#70bfff,#327ee5);box-shadow:0 5px 0 #2856a7}.btn.orange{background:linear-gradient(#ffcf65,#f58a29);box-shadow:0 5px 0 #b35c15}.btn:disabled{filter:grayscale(1);opacity:.5}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}.choices .btn{margin:0;min-height:64px}.mini{font-size:13px;opacity:.8}.stars{font-size:38px}.profile{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.profile .btn{min-width:130px}#rotate{display:none;position:absolute;inset:0;z-index:30;align-items:center;justify-content:center;text-align:center;background:#182e60;color:white;padding:20px;font-size:22px;font-weight:bold}@media(orientation:portrait) and (max-width:800px){#rotate{display:flex}}@media(max-height:420px){.panel{padding:10px}.panel h1{font-size:23px}.panel p{font-size:13px}.btn{padding:8px 12px}.choices .btn{min-height:45px}} #scene{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;background:linear-gradient(#83d6ff,#dff7ff)}#scene .scaler{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:top left}#scene .world{position:absolute;left:0;top:0;width:3100px;height:540px}#scene .tile{position:absolute;background:#98683d;border-top:16px solid #5dbd49;border-radius:5px 5px 0 0;box-shadow:inset 0 28px #ba8853}#scene .obj{position:absolute;line-height:1;white-space:nowrap;transform:translate(-50%,-50%)}#scene .hero{filter:drop-shadow(2px 4px 2px #0005)}#scene .hill{position:absolute;bottom:50px;width:240px;height:170px;background:#8fda80;border-radius:100% 100% 0 0;opacity:.65}#hud,#controls{z-index:3}#overlay{z-index:5}#rotate{z-index:10}</style></head><body><div id="scene"><div class="scaler" id="sceneScaler"><div id="scenery"></div><div class="world" id="worldDom"></div></div></div><canvas id="game"></canvas><div id="hud"><span id="hLevel">🌳 Màn 1</span><span id="hCoins">🪙 0</span><span id="hLife">❤️❤️❤️</span><button class="btn blue" style="font-size:13px;padding:7px 10px" id="pause">☰</button></div><div id="controls"><div class="cluster"><button class="control" id="left" aria-label="Đi trái">◀</button><button class="control" id="right" aria-label="Đi phải">▶</button></div><div class="cluster"><button class="control" id="jump" aria-label="Nhảy">⬆</button></div></div><div id="overlay"><div class="panel" id="panel"></div></div><div id="rotate">📱 ↻<br>Hãy xoay ngang iPhone/iPad để chơi nhé!</div><script>
(()=>{'use strict';const C=document.getElementById('game'),ctx=C.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel');let W=960,H=540,scale=1,cam=0,run=false,mode='Mon',level=0,coins=0,lives=3,player=null,platforms=[],items=[],enemies=[],gate=null,portal=null,particles=[],invuln=0,frame=0,questionPending=false,hasKey=false,asked=false,last=0,checkpoint=0;const total=8,worlds=['Rừng Xanh','Vườn Trái Cây','Đồi Sắc Màu','Ngôi Nhà Bí Mật','Hang Động','Bãi Biển','Trời Sao','Lâu Đài'];const themes=[['#79d7ff','#7ed56b'],['#b8eaff','#9de278'],['#a8d8ff','#f2cd77'],['#b9d4ff','#7ed7b0'],['#6378c7','#7881ae'],['#74e4fa','#ffe39c'],['#253a88','#6667bd'],['#ffb98e','#a6d884']];const words=[{w:'Cat',vi:'Con mèo',e:'🐱'},{w:'Dog',vi:'Con chó',e:'🐶'},{w:'Bird',vi:'Con chim',e:'🐦'},{w:'Fish',vi:'Con cá',e:'🐟'},{w:'Apple',vi:'Quả táo',e:'🍎'},{w:'Banana',vi:'Quả chuối',e:'🍌'},{w:'Orange',vi:'Quả cam',e:'🍊'},{w:'Grape',vi:'Quả nho',e:'🍇'},{w:'Red',vi:'Màu đỏ',e:'🔴'},{w:'Blue',vi:'Màu xanh dương',e:'🔵'},{w:'Yellow',vi:'Màu vàng',e:'🟡'},{w:'Green',vi:'Màu xanh lá',e:'🟢'},{w:'In',vi:'Ở trong',e:'📦'},{w:'On',vi:'Ở trên',e:'⬆️'},{w:'Under',vi:'Ở dưới',e:'⬇️'},{w:'Behind',vi:'Ở phía sau',e:'↩️'},{w:'Sun',vi:'Mặt trời',e:'☀️'},{w:'Moon',vi:'Mặt trăng',e:'🌙'},{w:'Star',vi:'Ngôi sao',e:'⭐'},{w:'Cloud',vi:'Đám mây',e:'☁️'},{w:'Water',vi:'Nước',e:'💧'},{w:'Tree',vi:'Cây',e:'🌳'},{w:'Flower',vi:'Bông hoa',e:'🌸'},{w:'House',vi:'Ngôi nhà',e:'🏠'}];let saved;try{saved=JSON.parse(localStorage.getItem('nhiMonMarioSave')||'{}')}catch(e){saved={}}let records=saved.records||{Mon:{unlock:0,best:{}},Nhi:{unlock:0,best:{}}};for(let m of ['Mon','Nhi'])if(!records[m])records[m]={unlock:0,best:{}};let bank=saved.bank||0;function save(){try{localStorage.setItem('nhiMonMarioSave',JSON.stringify({records,bank}))}catch(e){}}function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=mode==='Mon'?.78:.9;speechSynthesis.speak(u)}catch(e){}}function beep(f=620,d=.12){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.07,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.start();o.stop(a.currentTime+d);setTimeout(()=>a.close(),500)}catch(e){}}function show(html){overlay.classList.remove('hidden');panel.innerHTML=html;run=false;keys.left=keys.right=keys.jump=false}function hide(){overlay.classList.add('hidden');run=true;last=performance.now()}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function home(){show(`<div style="font-size:55px">🏃‍♀️🍄⭐</div><h1>NHI & MON<br>ENGLISH QUEST</h1><p>Chạy • Nhảy • Đạp quái • Ăn xu • Học tiếng Anh</p><p>Chọn người chơi:</p><div class="profile"><button class="btn orange" data-profile="Mon">👧 Mon · Dễ</button><button class="btn blue" data-profile="Nhi">👧 Nhi · Khó hơn</button></div><p>🪙 Kho xu chung: <b>${bank}</b></p><p class="mini">🎮 Xoay ngang màn hình • ◀ ▶ di chuyển • ⬆ nhảy<br>Đạp lên đầu quái để đánh bại • Tìm 🔑 để mở cổng</p>`);panel.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{mode=b.dataset.profile;selectLevel()})}function selectLevel(){const r=records[mode];show(`<h1>🗺️ ${mode} PHIÊU LƯU</h1><p>Chọn màn chơi · đã mở ${r.unlock+1}/${total}</p><div class="choices">${worlds.map((n,i)=>`<button class="btn ${i%2?'blue':'orange'}" data-l="${i}" ${i>r.unlock?'disabled':''}>${i>r.unlock?'🔒':'⭐'} ${i+1}. ${n}<br><small>${r.best[i]?'🏆 '+r.best[i]+' xu':''}</small></button>`).join('')}</div><button class="btn" id="back">⬅ Trang đầu</button>`);panel.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>start(+b.dataset.l));document.getElementById('back').onclick=home}const keys={left:false,right:false,jump:false};for(const k of ['left','right','jump']){const b=document.getElementById(k);function set(v,e){e.preventDefault();keys[k]=v;b.classList.toggle('pressed',v)}b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);set(true,e)});b.addEventListener('pointerup',e=>set(false,e));b.addEventListener('pointercancel',e=>set(false,e));b.addEventListener('lostpointercapture',()=>{keys[k]=false;b.classList.remove('pressed')})}document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','KeyA','KeyD','KeyW'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(['ArrowUp','KeyW','Space'].includes(e.code))keys.jump=true});document.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;if(['ArrowUp','KeyW','Space'].includes(e.code))keys.jump=false});window.addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false;if(run)pause()});document.getElementById('pause').onclick=()=>run?pause():null;function pause(){show(`<h1>⏸️ Tạm dừng</h1><p>Màn ${level+1}: ${worlds[level]}</p><button class="btn" id="resume">▶ Chơi tiếp</button><button class="btn blue" id="restart">↻ Chơi lại</button><button class="btn orange" id="menu">🗺️ Chọn màn</button>`);document.getElementById('resume').onclick=hide;document.getElementById('restart').onclick=()=>start(level);document.getElementById('menu').onclick=selectLevel}function start(l){level=l;coins=0;lives=3;hasKey=false;asked=false;invuln=0;cam=0;checkpoint=0;build();buildDOM();updateHUD();hide()}function build(){platforms=[{x:0,y:455,w:560,h:150},{x:650,y:455,w:490,h:150},{x:1240,y:455,w:510,h:150},{x:1850,y:455,w:550,h:150},{x:2500,y:455,w:600,h:150}];const elevated=[[280,365,150],[760,355,160],[1350,360,160],[1600,290,140],[1990,355,150],[2290,305,140],[2670,355,150]];elevated.forEach(([x,y,w])=>platforms.push({x,y,w,h:24}));items=[];for(let x=170;x<2920;x+=95){let y=390;if((x>280&&x<430)||(x>760&&x<920)||(x>1350&&x<1510)||(x>1990&&x<2140)||(x>2670&&x<2820))y=302;items.push({x,y,type:'coin',got:false})}items.push({x:1650,y:240,type:'key',got:false});enemies=[{x:420,y:421,a:365,b:525,v:1.05,alive:true},{x:910,y:421,a:760,b:1070,v:1.3,alive:true},{x:1460,y:421,a:1320,b:1660,v:1.4,alive:true},{x:2050,y:421,a:1920,b:2270,v:1.6,alive:true},{x:2710,y:421,a:2600,b:2890,v:1.7,alive:true}];gate={x:2860,y:355,w:42,h:100};portal={x:2990,y:365,w:68,h:90};player={x:65,y:390,w:34,h:46,vx:0,vy:0,onGround:false,face:1};particles=[]}function updateHUD(){document.getElementById('hLevel').textContent=`🌍 ${level+1}. ${worlds[level]}`;document.getElementById('hCoins').textContent=`🪙 ${coins} ${hasKey?'🔑':''}`;document.getElementById('hLife').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}function boxHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function hurt(){if(invuln>0)return;lives--;invuln=95;beep(170,.3);updateHUD();if(lives<=0){show(`<h1>💗 Thử lại nhé!</h1><p>Không sao, mình thử lại nào!</p><button class="btn" id="again">↻ Chơi lại màn</button><button class="btn blue" id="pick">🗺️ Chọn màn</button>`);document.getElementById('again').onclick=()=>start(level);document.getElementById('pick').onclick=selectLevel}else{player.x=checkpoint||65;player.y=280;player.vx=0;player.vy=0}}function addBurst(x,y,s='⭐'){for(let i=0;i<7;i++)particles.push({x,y,vx:(Math.random()-.5)*6,vy:-Math.random()*5,life:35,s})}function quiz(){questionPending=true;const group=level===0?words.slice(0,4):level===1?words.slice(4,8):level===2?words.slice(8,12):level===3?words.slice(12,16):level===4?words.slice(16,20):level===5?words.slice(20,24):level===6?words.slice(16,24):words;const answer=group[(level+Math.floor(coins/4))%group.length];let options=[answer];for(const w of [...group].sort(()=>Math.random()-.5)){if(options.length>=4)break;if(w!==answer)options.push(w)}options.sort(()=>Math.random()-.5);const isMon=mode==='Mon';show(`<h1>🔐 Cổng từ vựng!</h1><p>${isMon?'Nghe và chọn hình đúng:':'Chọn từ tiếng Anh đúng với nghĩa:'}</p><h2>${isMon?'🔊 '+answer.w:answer.vi+' '+answer.e}</h2><button class="btn orange" id="hear">🔊 Nghe phát âm</button><div class="choices">${options.map(w=>`<button class="btn blue" data-word="${esc(w.w)}">${isMon?w.e:w.w}</button>`).join('')}</div><p id="feedback" class="mini">Trả lời đúng để mở cổng và nhận 15 xu!</p>`);document.getElementById('hear').onclick=()=>speak(answer.w);speak(answer.w);panel.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{if(b.dataset.word===answer.w){beep(850,.18);coins+=15;bank+=15;save();asked=true;questionPending=false;updateHUD();show(`<div style="font-size:64px">🎉🔓⭐</div><h1>Chính xác!</h1><h2>${answer.e} ${answer.w}</h2><p>${answer.vi} · +15 xu</p><button class="btn" id="go">▶ Qua cổng!</button>`);speak('Excellent! '+answer.w);document.getElementById('go').onclick=hide}else{beep(230,.15);document.getElementById('feedback').textContent='🌟 Chưa đúng, bé thử lại nhé!';b.style.opacity='.45';b.disabled=true}})}function win(){const earned=coins+20;bank+=20;const r=records[mode];r.best[level]=Math.max(r.best[level]||0,earned);r.unlock=Math.max(r.unlock,Math.min(total-1,level+1));save();run=false;beep(1000,.4);show(`<div class="stars">⭐⭐⭐</div><h1>HOÀN THÀNH MÀN ${level+1}!</h1><div style="font-size:55px">🏆🎁🪙</div><h2>+20 xu thưởng!</h2><p>Thu thập: ${coins} xu · Tổng thưởng màn: ${earned} xu</p><p>Kho xu: <b>${bank}</b></p><button class="btn" id="next">${level<total-1?'▶ Màn tiếp theo':'🏰 Chơi lại từ đầu'}</button><button class="btn blue" id="map">🗺️ Bản đồ</button>`);document.getElementById('next').onclick=()=>start(level<total-1?level+1:0);document.getElementById('map').onclick=selectLevel}function update(dt){if(!run)return;frame++;if(invuln>0)invuln-=dt;const p=player;const speed=4.3;p.vx=(keys.right?speed:0)-(keys.left?speed:0);if(p.vx)p.face=Math.sign(p.vx);if(keys.jump&&p.onGround){p.vy=-12.8;p.onGround=false;beep(430,.06)}p.vy=Math.min(p.vy+.58*dt,13);let prevY=p.y;p.x=Math.max(0,Math.min(3050,p.x+p.vx*dt));for(let b of platforms)if(boxHit(p,b)&&p.vx){if(p.vx>0&&p.x+p.w-b.x<22)p.x=b.x-p.w;else if(p.vx<0&&b.x+b.w-p.x<22)p.x=b.x+b.w}p.y+=p.vy*dt;p.onGround=false;for(let b of platforms){if(p.x+p.w>b.x+4&&p.x<b.x+b.w-4&&p.y+p.h>=b.y&&prevY+p.h<=b.y+12&&p.vy>=0){p.y=b.y-p.h;p.vy=0;p.onGround=true}}if(p.y>H+150){hurt();return}if(p.x>1100&&checkpoint<700)checkpoint=720;if(p.x>1800&&checkpoint<1300)checkpoint=1900;if(p.x>2500&&checkpoint<2000)checkpoint=2550;for(let item of items){if(item.got)continue;if(Math.abs(p.x+17-item.x)<29&&Math.abs(p.y+20-item.y)<37){item.got=true;if(item.type==='coin'){coins+=5;bank+=5;beep(750,.06);addBurst(item.x,item.y,'✨')}else{hasKey=true;beep(1050,.2);addBurst(item.x,item.y,'🔑')}save();updateHUD()}}for(let e of enemies){if(!e.alive)continue;e.x+=e.v*dt;if(e.x<e.a||e.x>e.b)e.v*=-1;const b={x:e.x,y:e.y,w:36,h:34};if(boxHit(p,b)){if(p.vy>1&&prevY+p.h<=e.y+17){e.alive=false;p.vy=-9;coins+=10;bank+=10;beep(920,.12);addBurst(e.x,e.y,'⭐');save();updateHUD()}else hurt()}}if(p.x+p.w>gate.x&&p.x<gate.x+gate.w&&p.y+p.h>gate.y){if(!hasKey){p.x=gate.x-p.w-3;if(frame%75===0)beep(220,.1)}else if(!asked&&!questionPending){p.x=gate.x-p.w-3;quiz()}}if(p.x>portal.x&&asked)win();cam+=(Math.max(0,Math.min(3100-W,p.x-W*.34))-cam)*.12;particles=particles.filter(q=>q.life-->0);for(let q of particles){q.x+=q.vx;q.y+=q.vy;q.vy+=.2}}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function emoji(t,x,y,size=32){ctx.font=`${size}px system-ui,Apple Color Emoji,Segoe UI Emoji`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}function draw(){const t=themes[level];const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,t[0]);grad.addColorStop(1,'#eefbff');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);circle(790,95,46,'#fff5a6');for(let i=0;i<12;i++){let x=((i*293-cam*.22)%(W+350)+W+350)%(W+350)-100,y=80+(i%3)*55;emoji('☁️',x,y,55)}for(le
